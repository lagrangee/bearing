name: Prepare candidate artifact

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - scripts/**
      - src/**
      - skills/**
      - templates/**
      - docs/agents/bearing/**
      - docs/cli.md
      - docs/cli.zh-CN.md
      - docs/data-and-security.md
      - docs/data-and-security.zh-CN.md
      - docs/everyday-workflows.md
      - docs/everyday-workflows.zh-CN.md
      - docs/getting-started.md
      - docs/getting-started.zh-CN.md
      - docs/troubleshooting.md
      - docs/troubleshooting.zh-CN.md
      - README.md
      - README.zh-CN.md
      - SECURITY.md
      - CONTRIBUTING.md
      - CODE_OF_CONDUCT.md
      - CHANGELOG.md
      - THIRD_PARTY_NOTICES
      - LICENSE

permissions:
  contents: read

jobs:
  candidate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - run: npm ci
      - run: bun run secret:scan
      - run: npm audit --audit-level=high
      - run: bun run verify
      - run: bun run license:check
      - run: bun run package:check
      - run: bun scripts/prepare-release-candidate.ts --out release-candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bearing-candidate-${{ github.sha }}
          path: release-candidate/
          if-no-files-found: error
          retention-days: 30
