name: Publish frozen release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact frozen package version to publish
        required: true
        type: string
      source_commit:
        description: Exact 40-character Candidate source commit
        required: true
        type: string
      candidate_run_id:
        description: Successful Candidate Freeze workflow run ID
        required: true
        type: string
      frozen_sha256:
        description: Exact frozen tarball SHA-256 from the Candidate receipt
        required: true
        type: string
      confirm:
        description: Type publish @lagrangee/bearing
        required: true
        type: string

permissions:
  actions: read
  contents: write
  id-token: write

concurrency:
  group: publication-@lagrangee/bearing
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ inputs.confirm == 'publish @lagrangee/bearing' }}
    runs-on: macos-latest
    timeout-minutes: 30
    environment: npm-publish
    steps:
      - name: Verify exact successful Candidate Freeze run
        id: candidate_run
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RUN_ID: ${{ inputs.candidate_run_id }}
          EXPECTED_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = "refs/heads/main"

          CURRENT_MAIN_STATUS="$(gh api "repos/$GITHUB_REPOSITORY/compare/$EXPECTED_COMMIT...$GITHUB_SHA" --jq '.status')"
          case "$CURRENT_MAIN_STATUS" in ahead|identical) ;; *) exit 1 ;; esac

          RUN_FACTS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EXPECTED_RUN_ID" --jq '[.id, .path, .name, .event, .status, .conclusion, .head_branch, .head_sha, .run_attempt] | @tsv')"
          IFS=$'\t' read -r ACTUAL_RUN_ID ACTUAL_PATH ACTUAL_NAME ACTUAL_EVENT ACTUAL_STATUS ACTUAL_CONCLUSION ACTUAL_BRANCH ACTUAL_COMMIT ACTUAL_RUN_ATTEMPT <<< "$RUN_FACTS"
          test "$ACTUAL_RUN_ID" = "$EXPECTED_RUN_ID"
          test "$ACTUAL_PATH" = ".github/workflows/package.yml"
          test "$ACTUAL_NAME" = "Prepare candidate artifact"
          test "$ACTUAL_EVENT" = "workflow_dispatch"
          test "$ACTUAL_STATUS" = "completed"
          test "$ACTUAL_CONCLUSION" = "success"
          test "$ACTUAL_BRANCH" = "main"
          [[ "$ACTUAL_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ACTUAL_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]

          RUN_MAIN_STATUS="$(gh api "repos/$GITHUB_REPOSITORY/compare/$EXPECTED_COMMIT...$ACTUAL_COMMIT" --jq '.status')"
          case "$RUN_MAIN_STATUS" in ahead|identical) ;; *) exit 1 ;; esac

          NPM_STATUS="$(curl --silent --show-error --connect-timeout 5 --max-time 15 --retry 0 --output /dev/null --write-out '%{http_code}' 'https://registry.npmjs.org/@lagrangee%2fbearing')"
          case "$NPM_STATUS" in
            200) PACKAGE_STATE=present ;;
            404) PACKAGE_STATE=absent ;;
            *) echo "npm package state is unverifiable: HTTP $NPM_STATUS" >&2; exit 1 ;;
          esac
          printf 'run_attempt=%s\n' "$ACTUAL_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          printf 'package_state=%s\n' "$PACKAGE_STATE" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - name: Install publication verifier dependencies
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bearing-candidate-${{ inputs.source_commit }}
          path: release-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Bootstrap only the absent npm package
        if: ${{ steps.candidate_run.outputs.package_state == 'absent' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_COMMIT: ${{ inputs.source_commit }}
          EXPECTED_RUN_ID: ${{ inputs.candidate_run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ steps.candidate_run.outputs.run_attempt }}
          EXPECTED_FROZEN_SHA256: ${{ inputs.frozen_sha256 }}
        run: |
          bun scripts/publish-release-candidate.ts \
            --receipt release-candidate/candidate-receipt.json \
            --version "$EXPECTED_VERSION" \
            --source-commit "$EXPECTED_COMMIT" \
            --workflow-run-id "$EXPECTED_RUN_ID" \
            --workflow-run-attempt "$EXPECTED_RUN_ATTEMPT" \
            --frozen-sha256 "$EXPECTED_FROZEN_SHA256" \
            --bootstrap-absent-package
      - name: Verify frozen bundle and recover exact publication
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_COMMIT: ${{ inputs.source_commit }}
          EXPECTED_RUN_ID: ${{ inputs.candidate_run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ steps.candidate_run.outputs.run_attempt }}
          EXPECTED_FROZEN_SHA256: ${{ inputs.frozen_sha256 }}
        run: |
          bun scripts/publish-release-candidate.ts \
            --receipt release-candidate/candidate-receipt.json \
            --version "$EXPECTED_VERSION" \
            --source-commit "$EXPECTED_COMMIT" \
            --workflow-run-id "$EXPECTED_RUN_ID" \
            --workflow-run-attempt "$EXPECTED_RUN_ATTEMPT" \
            --frozen-sha256 "$EXPECTED_FROZEN_SHA256"
