name: Validate and deploy Portal demo

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/demo-pages.yml
      - .gitignore
      - browser-tests/demo-**
      - demo/**
      - docs/data-and-security.md
      - docs/data-and-security.zh-CN.md
      - package.json
      - package-lock.json
      - README.md
      - README.zh-CN.md
      - scripts/check-package-boundary.ts
      - scripts/release-boundary.ts
      - SECURITY.md
      - src/portal-ui/**
      - tests/demo-pages-contract.test.ts
  push:
    branches: [main]
    paths:
      - .github/workflows/demo-pages.yml
      - .gitignore
      - browser-tests/demo-**
      - demo/**
      - docs/data-and-security.md
      - docs/data-and-security.zh-CN.md
      - package.json
      - package-lock.json
      - README.md
      - README.zh-CN.md
      - scripts/check-package-boundary.ts
      - scripts/release-boundary.ts
      - SECURITY.md
      - src/portal-ui/**
      - tests/demo-pages-contract.test.ts

permissions: {}

jobs:
  validate:
    name: Validate static Pages artifact
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - run: npm ci
      - run: npx playwright install chromium
      - run: bun run demo:verify
      - name: Upload verified Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages-artifact

  deploy:
    name: Deploy verified Pages artifact
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
