name: Validate and deploy Portal demo

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact frozen package version
        required: true
        type: string
      source_commit:
        description: Exact Candidate source commit
        required: true
        type: string
      candidate_workflow_name:
        description: Exact Candidate Freeze workflow name
        required: true
        type: string
      candidate_run_id:
        description: Successful Candidate Freeze workflow run ID
        required: true
        type: string
      candidate_run_attempt:
        description: Exact Candidate Freeze workflow attempt
        required: true
        type: string
      frozen_sha256:
        description: Exact frozen tarball SHA-256
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/demo-pages.yml
      - .gitignore
      - browser-tests/demo-**
      - demo/**
      - docs/data-and-security.md
      - docs/data-and-security.zh-CN.md
      - package.json
      - package-lock.json
      - README.md
      - README.zh-CN.md
      - scripts/check-package-boundary.ts
      - scripts/release-boundary.ts
      - SECURITY.md
      - src/portal-ui/**
      - tests/demo-pages-contract.test.ts
  push:
    branches: [main]
    paths:
      - .github/workflows/demo-pages.yml
      - .gitignore
      - browser-tests/demo-**
      - demo/**
      - docs/data-and-security.md
      - docs/data-and-security.zh-CN.md
      - package.json
      - package-lock.json
      - README.md
      - README.zh-CN.md
      - scripts/check-package-boundary.ts
      - scripts/release-boundary.ts
      - SECURITY.md
      - src/portal-ui/**
      - tests/demo-pages-contract.test.ts

permissions: {}

jobs:
  validate:
    name: Validate static Pages artifact
    runs-on: macos-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - name: Install public-prefix verifier dependencies
        if: github.event_name == 'workflow_dispatch'
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: bearing-candidate-${{ inputs.source_commit }}
          path: release-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Verify exact published prefix
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CANDIDATE_WORKFLOW_NAME: ${{ inputs.candidate_workflow_name }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          FROZEN_SHA256: ${{ inputs.frozen_sha256 }}
        run: |
          set -euo pipefail
          RESULT_PATH="$RUNNER_TEMP/public-release-prefix.json"
          bun scripts/public-release-smoke.ts \
            --candidate-receipt release-candidate/candidate-receipt.json \
            --version "$EXPECTED_VERSION" --source-commit "$SOURCE_COMMIT" \
            --workflow-name "$CANDIDATE_WORKFLOW_NAME" --workflow-run-id "$CANDIDATE_RUN_ID" \
            --workflow-run-attempt "$CANDIDATE_RUN_ATTEMPT" --frozen-sha256 "$FROZEN_SHA256" \
            > "$RESULT_PATH" || true
          node - "$RESULT_PATH" <<'NODE'
          const { readFileSync } = require("node:fs");
          const result = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (result.checks.npm !== "exact" || result.checks.tag !== "exact" || result.checks.release !== "exact") process.exit(1);
          NODE
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event_name == 'workflow_dispatch'
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Install exact Candidate dependencies
        if: github.event_name == 'workflow_dispatch'
        run: npm ci
      - name: Verify exact Candidate source
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$PACKAGE_VERSION" = "$EXPECTED_VERSION"
      - run: npm ci
        if: github.event_name != 'workflow_dispatch'
      - run: npx playwright install chromium
      - run: bun run demo:verify
      - name: Upload demo failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: demo-pages-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/demo-pages/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload verified Pages artifact
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ inputs.source_commit }}
          path: pages-artifact
          retention-days: 7

  deploy:
    name: Deploy verified Pages artifact
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: github-pages-${{ inputs.source_commit }}
